<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todo — Local Storage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>To‑Do List</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input id="new-todo" type="text" placeholder="What needs to be done?" aria-label="New todo" />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <div class="controls">
      <div class="filters" role="tablist" aria-label="Filter todos">
        <button data-filter="all" class="filter active">All</button>
        <button data-filter="active" class="filter">Active</button>
        <button data-filter="completed" class="filter">Completed</button>
      </div>

      <div class="actions">
        <input id="search" type="search" placeholder="Search" aria-label="Search todos" />
        <button id="clear-completed" title="Clear completed">Clear Completed</button>
      </div>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="todo-count">0 items</span>
      <small>Saved locally in your browser</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
